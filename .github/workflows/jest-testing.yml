name: Run Jest testing suite
on:
  workflow_dispatch:
  pull_request:

env:
  NODE_ENV: "test"

jobs:
  testing:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Jest With Coverage (Unit Tests)
        run: bun run test

      - name: Save Unit Test Report
        if: always()
        run: |
          echo "## Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "$(cat test-dashboard.md)" >> $GITHUB_STEP_SUMMARY

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Start Anvil
        run: bun run test:anvil &

      - name: Wait for Anvil
        run: |
          for i in {1..30}
          do
            if curl -s http://127.0.0.1:8545; then
              break
            fi
            sleep 1
          done || exit 1

      - name: Jest Integration Tests
        run: bun run test:integration

      - name: Save Integration Test Report
        if: always()
        run: |
          echo "## Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "$(cat test-dashboard.md)" >> $GITHUB_STEP_SUMMARY
